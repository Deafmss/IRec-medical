name: iRec Saúde CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    # Falha apenas nos erros que quebram em runtime (ReferenceError, case
    # duplicado, hook condicional). O `vite build` não pega nenhum deles.
    # Regras verificadas: scripts/ci-lint-gate.mjs
    - name: Verificar Erros de Runtime (ESLint)
      run: npm run lint:ci

    - name: Execute Production Build Verification
      run: npm run build

    - name: Verify Bundle Integrity
      run: ls -la dist/
